<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SHERKO LIVE · Studio de production</title>
  <meta name="description" content="Générateur de conducteurs, planning et casting pour les lives Twitch de SHERKO." />
  <meta name="theme-color" content="#0B0B12" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/sherko.css" />
</head>
<body>

  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <button class="brand" data-nav="lives" type="button">
      <span class="brand-mark">◢◤</span>
      <span class="brand-txt">SHERKO<b>LIVE</b></span>
    </button>
    <nav class="topnav" id="topnav">
      <button class="topnav-btn" data-nav="lives" type="button">Lives</button>
      <button class="topnav-btn" data-nav="equipe" type="button">Équipe</button>
      <button class="topnav-btn" data-nav="generateur" type="button">Générateur</button>
    </nav>
    <div class="topbar-right">
      <span class="live-clock" id="liveClock">--:--</span>
      <button class="btn btn-primary btn-sm" data-action="new-live" type="button">＋ Live</button>
    </div>
  </header>

  <!-- ============ APP ROOT ============ -->
  <main id="app" class="app"></main>

  <!-- ============ BOTTOM NAV (mobile) ============ -->
  <nav class="botnav">
    <button class="botnav-btn" data-nav="lives" type="button"><span>▤</span>Lives</button>
    <button class="botnav-btn" data-nav="equipe" type="button"><span>☻</span>Équipe</button>
    <button class="botnav-btn" data-nav="generateur" type="button"><span>✦</span>Générer</button>
  </nav>

  <!-- ============ MODAL HOST ============ -->
  <div class="modal-host" id="modalHost" hidden></div>

  <!-- ============ TOAST ============ -->
  <div class="toast-host" id="toastHost"></div>

  <script src="/assets/sherko.js" defer></script>
</body>
</html>
